name: Update Reality Configs (Manual + Schedule)

on:
  workflow_dispatch:          # اجازه می‌ده دستی Run workflow بزنی
  schedule:
    - cron: '0 */6 * * *'     # مثلاً هر ۶ ساعت یک‌بار (اختیاری)

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # مهم: تمام تاریخچه رو بگیر تا بتونی commit کنی

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run the Python script
        run: python config_collector.py          # ← اسم فایل اسکریپت پایتونت رو اینجا بگذار

      - name: Configure git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit and push if changes exist
        run: |
          git add reality_strict_configs* || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update Reality configs - $(date '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
